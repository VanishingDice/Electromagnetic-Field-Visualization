<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>电磁场可视化</title>
<script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
<script>
  /* 出错时把信息显示在页面上，否则画布黑掉会毫无线索 */
  window.addEventListener('error', function (e) {
    var d = document.getElementById('err');
    if (!d) {
      d = document.createElement('div');
      d.id = 'err';
      document.body.appendChild(d);
    }
    d.style.display = 'block';
    d.textContent += (d.textContent ? '\n' : '') + '脚本错误：' + e.message;
  });
</script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    background: #000;
    color: #b9b3ac;
    font: 13px/1.55 system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  #stage {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    display: grid;
    place-items: center;
    padding: 16px;
  }
  #stage canvas {
    display: block;
    border-radius: 10px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .85);
  }

  #panel {
    flex: 0 0 322px;
    width: 322px;
    height: 100%;
    overflow-y: auto;
    background: #0a0a0b;
    border-left: 1px solid #1c1c1f;
    padding: 18px 16px 48px;
  }
  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }

  #panel h1 { font-size: 14px; margin: 0 0 3px; color: #ded8d0; letter-spacing: .4px; font-weight: 600; }
  #panel .sub { margin: 0 0 4px; font-size: 11.5px; color: #6d6660; }
  #panel h2 {
    font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
    color: #6d6660; margin: 20px 0 10px; font-weight: 600;
  }
  #panel h2:first-of-type { margin-top: 14px; }

  .ctl {
    display: grid; grid-template-columns: 62px 1fr 58px;
    align-items: center; gap: 9px; margin: 0 0 9px;
  }
  .ctl > span { font-size: 11.5px; color: #8b837b; white-space: nowrap; }

  input[type=number] {
    width: 100%; padding: 3px 4px; text-align: right;
    background: #141416; color: #b9b3ac;
    border: 1px solid #26262a; border-radius: 4px;
    font: inherit; font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number]:focus { outline: none; border-color: #3f4148; color: #ded8d0; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 3px; background: #26262a;
    border-radius: 2px; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: #b9b3ac; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border: none;
    border-radius: 50%; background: #b9b3ac; cursor: pointer;
  }
  input[type=color] {
    width: 34px; height: 22px; padding: 0; cursor: pointer;
    border: 1px solid #2a2a2e; border-radius: 4px;
    background: none; justify-self: start;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 2px; }

  .card {
    border: 1px solid #1c1c1f; border-radius: 8px;
    padding: 9px 10px 4px; margin-bottom: 8px; background: #0d0d0f;
  }
  .card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .card .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .card .dot.bar { width: 16px; border-radius: 2px; }
  .card .name { flex: 1; font-size: 11.5px; color: #a9a29a; }
  .card .del {
    border: none; background: none; color: #5c5650;
    font-size: 16px; line-height: 1; padding: 0 3px; cursor: pointer;
  }
  .card .del:hover { color: #c98b7a; }
  .card .ctl { grid-template-columns: 30px 1fr 58px; margin-bottom: 6px; }

  .btn {
    width: 100%; padding: 8px; margin-top: 4px;
    border: 1px solid #2a2a2e; border-radius: 6px;
    background: #141416; color: #b9b3ac;
    font: inherit; font-size: 11.5px; cursor: pointer;
  }
  .btn:hover { border-color: #3a3a40; color: #ded8d0; }
  .btn.ghost { background: none; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .note { font-size: 10.5px; color: #5c5650; line-height: 1.6; margin: 10px 0 0; }

  #err {
    display: none; position: fixed; left: 16px; bottom: 44px; z-index: 99;
    max-width: 56vw; padding: 10px 14px; white-space: pre-wrap;
    background: #2a1616; color: #e8a6a6; border: 1px solid #532626;
    border-radius: 8px; font: 12px/1.6 ui-monospace, Consolas, monospace;
  }

  /* 左下角版本号 */
  #ver {
    position: fixed; left: 16px; bottom: 12px; z-index: 50;
    font: 11px/1 ui-monospace, Consolas, monospace;
    color: #4a4a52; letter-spacing: .6px;
    pointer-events: none; user-select: none;
  }

  /* ---------------- 手机：上显示、下设置 ---------------- */
  @media (max-width: 760px) {
    /* 100dvh 在支持的浏览器里会扣掉地址栏，写在后面覆盖前面 */
    body { flex-direction: column; height: 100vh; height: 100dvh; }

    #stage {
      flex: 1 1 auto;
      padding: 8px;
    }

    #panel {
      flex: 0 0 46vh;
      width: 100%;
      height: 46vh;
      flex: 0 0 46dvh;      /* 不支持的浏览器会忽略这两行，保留上面的 vh */
      height: 46dvh;
      border-left: none;
      border-top: 1px solid #1c1c1f;
      padding: 10px 14px 40px;
      -webkit-overflow-scrolling: touch;
    }

    #panel h1 { font-size: 13px; }
    #panel .sub { margin-bottom: 0; }

    /* 底部被面板占了，版本号挪到右上 */
    #ver { left: auto; right: 12px; top: 10px; bottom: auto; }
    #err { bottom: auto; top: 34px; }
  }
</style>

<body>

<main id="stage"></main>

<aside id="panel">
  <h1>电磁场可视化</h1>
  <p class="sub">拖动电荷或平板 · 右侧实时调整</p>

  <h2>流场</h2>
  <label class="ctl"><span>粒子数</span>
    <input id="np" type="range" min="200" max="2600" step="100" value="1400">

  </label>
  <label class="ctl"><span>拖尾长度</span>
    <input id="trl" type="range" min="0" max="100" step="1" value="34">
    <input id="trln" type="number" min="0" max="100" step="1" value="34">
  </label>
  <label class="ctl"><span>流速</span>
    <input id="spd" type="range" min="0.8" max="7" step="0.1" value="3.4">
    <input id="spdn" type="number" min="0.8" max="7" step="0.1" value="3.4">
  </label>

  <h2>电荷</h2>
  <div id="chargeList"></div>
  <button id="add" class="btn">+ 添加电荷</button>

  <h2>平板</h2>
  <div id="plateList"></div>
  <button id="addPlate" class="btn">+ 添加平板</button>

  <h2>全局</h2>
  <button id="reset" class="btn ghost">重置为默认</button>
  <p class="note">电荷量为正时向外发射场线，为负时吸收；为 0 不参与计算。<br>平板 λ 为 0 时不再发射场线，但仍然可以拖动。</p>
</aside>

<!-- 版本号：只在这里改 -->
<div id="ver">v0.0.5</div>

<script>
/* =====================================================================
   电磁场可视化 —— 若干有限长带电平板 + 若干可拖动的点电荷
   粒子沿 E 运动，在独立拖尾层上留下场线；右侧面板实时改参数。

   点电荷:      E = k q (r−r0) / |r−r0|³
   有限长线电荷: Ex = kλ (1/ra − 1/rb)
                Ey = kλ (b/rb − a/ra) / y
   ===================================================================== */

/* 两套场景：宽屏（横向）和手机（纵向）。
   坐标写成「参考尺寸下的像素」（refW × refH），装载时折算成 0~1 的比例，
   渲染时再乘回画布尺寸 —— 这样画布怎么变，内容都铺满，不留空边。 */
const LAYOUTS = {
  wide: {
    refW: 1600, refH: 900,
    charges: [
      {x: -470, y: -180, q:  1.00, color: '#b48a84'},
      {x:  170, y: -260, q: -1.30, color: '#8094a6'},
      {x:  600, y:  120, q:  0.70, color: '#96a688'},
    ],
    plates: [{x: 0, y: 210, len: 620, lambda: 0.55, color: '#8a8f96'}],
  },
  tall: {
    refW: 440, refH: 640,
    charges: [
      {x: -105, y: -140, q:  1.00, color: '#b48a84'},
      {x:   55, y: -195, q: -1.30, color: '#8094a6'},
      {x:  135, y:   70, q:  0.70, color: '#96a688'},
    ],
    plates: [{x: 0, y: 225, len: 220, lambda: 0.55, color: '#8a8f96'}],
  },
};

const MOBILE_QUERY = '(max-width: 760px)';

let MODE = 'wide';

let W = 1600, H = 900;            // 画布实际 CSS 尺寸（世界坐标就是它）
let R0 = W / 16;                  // 长度尺度：跟着画布宽度走
let UNIT = R0 / 100;              // 相对参考尺寸的单位比，用来缩放流速

const TAU = Math.PI * 2;
const BG = [0, 0, 0];             // 纯黑背景，拖尾最终收敛到全黑

/* ---------------- 莫兰迪色系 ---------------- */
/* 低饱和 + 灰度底子；亮度压到 60% 左右，在纯黑背景上才立得住 */
const MORANDI = [
  '#b48a84',   // 灰玫瑰
  '#8094a6',   // 灰蓝
  '#96a688',   // 灰绿
  '#9e8ca0',   // 灰紫
  '#baa07c',   // 灰驼
  '#8a8f96',   // 石墨
  '#a8928f',   // 灰褐
  '#8f9a8a',   // 灰橄榄
];

/* ---------------- 可编辑状态 ---------------- */
let CHARGES = LAYOUTS.wide.charges.map(c => ({...c}));
let PLATES  = LAYOUTS.wide.plates.map(p => ({...p}));

/* 按模式装载默认场景：参考像素 → 比例 */
function loadScene(mode) {
  const L = LAYOUTS[mode];
  CHARGES = L.charges.map(c => ({...c, nx: c.x / L.refW, ny: c.y / L.refH}));
  PLATES  = L.plates.map(p => ({...p,
    nx: p.x / L.refW, ny: p.y / L.refH, nlen: p.len / L.refW}));
  syncLayout();
}

/* 比例 → 画布像素。窗口尺寸变化后调用，内容会自动重新铺满 */
function syncLayout() {
  R0 = W / 16;
  UNIT = R0 / 100;
  for (const c of CHARGES) {
    c.x = c.nx * W;
    c.y = c.ny * H;
  }
  for (const p of PLATES) {
    p.x = p.nx * W;
    p.y = p.ny * H;
    p.len = p.nlen * W;
  }
}

/* 画布像素 → 比例。拖动、改长度之后调用，记住布局 */
function captureLayout() {
  for (const c of CHARGES) {
    c.nx = c.x / W;
    c.ny = c.y / H;
  }
  for (const p of PLATES) {
    p.nx = p.x / W;
    p.ny = p.y / H;
    p.nlen = p.len / W;
  }
}

let N_PARTICLES = 1400;
let SPEED = 3.4;
let TAIL_N = 30;                // 每颗粒子保留多少帧轨迹
const TAIL_MIN = 4, TAIL_MAX = 80;
const MAX_CHARGES = 8;
const MAX_PLATES  = 6;

/* 滑杆 0~100 → 保留帧数 */
function setTail(v) {
  TAIL_N = Math.round(TAIL_MIN + (v / 100) * (TAIL_MAX - TAIL_MIN));
}

/* 拖拽 / 悬停：{kind: 'charge'|'plate'|null, idx, dx, dy}
   dx/dy 是按下时「鼠标位置」到「物体中心」的偏移，保证抓住哪里就从哪里拖，
   不会先跳到几何中心。 */
const NO_DRAG = () => ({kind: null, idx: -1, dx: 0, dy: 0});
let drag  = NO_DRAG();
let hover = NO_DRAG();

const HIT_R     = 38;    // 电荷抓取半径
const PLATE_HIT = 22;    // 平板抓取距离
const marginPx  = () => Math.max(12, W * 0.037);
const pointer   = {x: 0, y: 0};

let particles = [];
let sources   = [];
let cnv;

/* ---------------- 小工具 ---------------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

function hexToRgb(h) {
  let s = String(h).replace('#', '');
  if (s.length === 3) s = s.split('').map(c => c + c).join('');
  const n = parseInt(s, 16) || 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function formatQ(q) {
  if (Math.abs(q) < 0.005) return '0';
  return (q > 0 ? '+' : '−') + Math.abs(q).toFixed(2) + 'q';
}

function chargeRadius(q) {
  return 11 + Math.min(Math.abs(q), 2.6) * 6;
}

/* ---------------- 场 ---------------- */
function fieldAt(px, py) {
  const x = px / R0, y = py / R0;
  let ex = 0, ey = 0;

  for (let i = 0; i < CHARGES.length; i++) {
    const c = CHARGES[i];
    if (c.q === 0) continue;
    const dx = x - c.x / R0;
    const dy = y - c.y / R0;
    const r2 = dx * dx + dy * dy;
    if (r2 < 0.0016) continue;          // 避开奇点
    const inv = c.q / (r2 * Math.sqrt(r2));
    ex += inv * dx;
    ey += inv * dy;
  }

  for (let i = 0; i < PLATES.length; i++) {
    const pl = PLATES[i];
    if (pl.lambda === 0 || pl.len <= 0) continue;

    const L = pl.len / R0 / 2;
    const a = x - pl.x / R0 - L;
    const b = x - pl.x / R0 + L;
    const yy = y - pl.y / R0;
    const ra = Math.sqrt(a * a + yy * yy);
    const rb = Math.sqrt(b * b + yy * yy);
    const ys = Math.abs(yy) < 0.02 ? (yy >= 0 ? 0.02 : -0.02) : yy;

    ex += pl.lambda * (1 / ra - 1 / rb);
    ey += pl.lambda * (b / rb - a / ra) / ys;
  }

  return [ex, ey];
}

/* ---------------- 源头（谁在发射场线） ---------------- */
function rebuildSources() {
  sources = [];

  for (let i = 0; i < CHARGES.length; i++) {
    const c = CHARGES[i];
    if (c.q > 0) {
      sources.push({kind: 'charge', idx: i, w: Math.abs(c.q), rgb: hexToRgb(c.color)});
    }
  }

  for (let i = 0; i < PLATES.length; i++) {
    const pl = PLATES[i];
    if (pl.lambda > 0) {
      sources.push({kind: 'plate', idx: i, w: pl.lambda * 3.5, rgb: hexToRgb(pl.color)});
    }
  }

  for (let i = 0; i < sources.length; i++) sources[i].ch = i;
}

function pickSource() {
  if (!sources.length) return null;
  let total = 0;
  for (let i = 0; i < sources.length; i++) total += sources[i].w;
  if (total <= 0) return null;

  let r = random(total);
  for (let i = 0; i < sources.length; i++) {
    r -= sources[i].w;
    if (r <= 0) return sources[i];
  }
  return sources[sources.length - 1];
}

/* ---------------- 粒子 ---------------- */
function spawnParticle(p) {
  const src = pickSource();

  if (!src) {
    p.x = random(-W / 2, W / 2);
    p.y = random(-H / 2, H / 2);
    p.rgb = [150, 150, 150];
    p.ch = 0;
  } else if (src.kind === 'charge') {
    const c = CHARGES[src.idx];
    if (!c) { p.x = 0; p.y = 0; p.rgb = src.rgb; p.ch = src.ch; }
    else {
      const a = random(TAU);
      p.x = c.x + Math.cos(a) * 24;
      p.y = c.y + Math.sin(a) * 24;
      p.rgb = src.rgb;
      p.ch = src.ch;
    }
  } else {
    const pl = PLATES[src.idx];
    if (!pl) { p.x = 0; p.y = 0; p.rgb = src.rgb; p.ch = src.ch; }
    else {
      p.x = pl.x + random(-pl.len / 2, pl.len / 2);
      p.y = pl.y + (random() < 0.5 ? -1 : 1) * 14;
      p.rgb = src.rgb;
      p.ch = src.ch;
    }
  }

  p.mul     = random(0.85, 1.15);
  p.jit     = random(-0.03, 0.03);
  p.life    = 0;
  p.maxLife = random(160, 460);
  p.alpha   = random(120, 210);
  p.hist    = [];
  p.skip    = true;
}

function blankParticle() {
  return {x: 0, y: 0, rgb: [160, 160, 160], ch: 0, mul: 1, jit: 0,
          life: 0, maxLife: 300, alpha: 150, hist: [], skip: true};
}

function setParticleCount(n) {
  N_PARTICLES = n;
  if (!particles) particles = [];
  while (particles.length < n) {
    const p = blankParticle();
    spawnParticle(p);
    particles.push(p);
  }
  if (particles.length > n) particles.length = n;
}

function initParticles() {
  particles = [];
  setParticleCount(N_PARTICLES);
}

/* 推进一步，返回这一小段（绘制与离线预览共用） */
function advect(p) {
  const f = fieldAt(p.x, p.y);

  const ca = Math.cos(p.jit), sa = Math.sin(p.jit);
  const rx = f[0] * ca - f[1] * sa;
  const ry = f[0] * sa + f[1] * ca;

  const m = Math.hypot(rx, ry);
  if (!(m > 1e-9)) {                    // 没有场：重新投放到有场的地方
    spawnParticle(p);
    return {skip: true};
  }

  const step = SPEED * UNIT * p.mul;   // UNIT 让竖屏下的相对速度与宽屏一致
  const nx = p.x + (rx / m) * step;
  const ny = p.y + (ry / m) * step;

  p.skip = false;
  p.x = nx;
  p.y = ny;
  p.life++;

  // 记录轨迹点：拖尾靠这份历史画出来，不靠像素累积
  p.hist.push(nx, ny);
  if (p.hist.length > TAIL_N * 2) {
    p.hist.splice(0, 2);
  }

  let dead = p.life > p.maxLife;
  if (Math.abs(p.x) > W / 2 + 40 || Math.abs(p.y) > H / 2 + 40) dead = true;
  for (let k = 0; k < CHARGES.length; k++) {
    const c = CHARGES[k];
    if (c.q !== 0 && Math.hypot(p.x - c.x, p.y - c.y) < 24) dead = true;
  }
  if (dead) spawnParticle(p);

  return {skip: p.skip};
}

rebuildSources();   // 纯 JS，不碰 p5，可以在顶层跑

/* ===================== p5 ===================== */

/* 画布可用区域 = #stage 减去内边距 */
function fitStage() {
  const el = document.getElementById('stage');
  if (!el) return [W, H];
  const cs = getComputedStyle(el);
  const w = el.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const h = el.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  return [Math.max(320, Math.round(w)), Math.max(240, Math.round(h))];
}

function currentDensity() {
  return Math.min(window.devicePixelRatio || 1, 2);
}

function setup() {
  // 先量画布，再决定用哪套场景（装载时要用到 W/H）
  const [w, h] = fitStage();
  W = w;
  H = h;

  MODE = window.matchMedia(MOBILE_QUERY).matches ? 'tall' : 'wide';
  if (MODE === 'tall') N_PARTICLES = 700;   // 小屏降低顶点数，避免掉帧
  loadScene(MODE);        // 内部会 syncLayout()
  rebuildSources();

  cnv = createCanvas(W, H);
  cnv.parent('stage');
  pixelDensity(currentDensity());
  randomSeed(7);

  // 必须等 p5 就绪后再初始化粒子：spawnParticle 用到 p5 的 random()
  initParticles();

  buildPanel();
  attachPointer();
}

/* 横竖布局切换：换一套场景和默认摆位 */
function setMode(next) {
  if (next === MODE) return;
  MODE = next;
  loadScene(MODE);
  rebuildSources();
  renderAll();
}

/* 窗口尺寸变了就重算画布，内容按比例重新铺满 */
function windowResized() {
  if (!cnv) return;

  const next = window.matchMedia(MOBILE_QUERY).matches ? 'tall' : 'wide';
  const modeChanged = next !== MODE;

  const [w, h] = fitStage();
  // 布局切换了就得无条件重算，不受尺寸是否相同影响
  if (!modeChanged && w === W && h === H) return;

  W = w;
  H = h;

  if (modeChanged) {
    setMode(next);        // loadScene 里会 syncLayout
  } else {
    syncLayout();         // 只改尺寸：保持相对布局，重新铺满
    rebuildSources();
  }

  resizeCanvas(W, H);
}

function draw() {
  // 每帧整块清成纯黑 —— 没有任何残留，这就是「真黑」的来源
  background(BG[0], BG[1], BG[2]);

  if (drag.kind === 'charge' && drag.idx >= CHARGES.length) drag = NO_DRAG();
  if (drag.kind === 'plate' && drag.idx >= PLATES.length) drag = NO_DRAG();

  push();
  translate(W / 2, H / 2);
  noFill();
  strokeCap(ROUND);
  strokeWeight(1.3);

  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    advect(p);

    const h = p.hist;
    if (h.length < 4) continue;          // 刚重生的粒子先不画

    stroke(p.rgb[0], p.rgb[1], p.rgb[2], p.alpha);
    beginShape();
    for (let k = 0; k < h.length; k += 2) vertex(h[k], h[k + 1]);
    endShape();
  }

  // 静态元素画在粒子之上
  drawPlates();
  drawCharges();
  drawLabels();

  pop();

  updateCursor();
}

function drawPlates() {
  for (let i = 0; i < PLATES.length; i++) {
    const pl = PLATES[i];
    const rgb = hexToRgb(pl.color);
    const active = (hover.kind === 'plate' && hover.idx === i) ||
                   (drag.kind === 'plate' && drag.idx === i);
    const x0 = pl.x - pl.len / 2, x1 = pl.x + pl.len / 2;

    noStroke();
    for (let k = 6; k > 0; k--) {
      fill(rgb[0], rgb[1], rgb[2], active ? 14 : 9);
      rect(x0 - k * 3, pl.y - 9 - k * 2, pl.len + k * 6, 18 + k * 4, 8);
    }

    fill(12, 12, 14);
    stroke(rgb[0], rgb[1], rgb[2], active ? 255 : 185);
    strokeWeight(active ? 3 : 2);
    rect(x0, pl.y - 9, pl.len, 18, 7);

    noStroke();
    fill(rgb[0], rgb[1], rgb[2], 210);
    textAlign(CENTER, CENTER);
    textSize(13);
    const sign = pl.lambda < 0 ? '−' : '+';
    const n = Math.max(3, Math.round(pl.len / 70));
    for (let k = 0; k < n; k++) {
      text(sign, x0 + (k + 0.5) * (pl.len / n), pl.y);
    }

    if (active) {
      noFill();
      stroke(rgb[0], rgb[1], rgb[2], 90);
      strokeWeight(1);
      rect(x0 - 6, pl.y - 14, pl.len + 12, 28, 10);
      noStroke();
    }

    // 标签
    fill(130, 124, 118);
    textAlign(LEFT, CENTER);
    textSize(16);
    text('平板 λ=' + pl.lambda.toFixed(2), x1 + 20, pl.y);
  }
}

function drawCharges() {
  for (let i = 0; i < CHARGES.length; i++) {
    const c = CHARGES[i];
    const rgb = hexToRgb(c.color);
    const r = chargeRadius(c.q);

    noStroke();
    for (let k = 7; k > 0; k--) {
      fill(rgb[0], rgb[1], rgb[2], 11);
      circle(c.x, c.y, r * 2 + k * 13);
    }

    fill(rgb[0], rgb[1], rgb[2]);
    circle(c.x, c.y, r * 2);

    if (hover.kind === 'charge' && hover.idx === i) {
      noFill();
      stroke(rgb[0], rgb[1], rgb[2], drag.kind === 'charge' ? 235 : 120);
      strokeWeight(drag.kind === 'charge' ? 2.5 : 1.5);
      circle(c.x, c.y, r * 2 + 14 + (drag.kind === 'charge' ? 6 : 0));
      noStroke();
    }

    fill(10, 10, 12);
    textAlign(CENTER, CENTER);
    textSize(r * 1.1);
    textStyle(BOLD);
    text(c.q > 0 ? '+' : c.q < 0 ? '−' : '·', c.x, c.y + 1);
    textStyle(NORMAL);
  }
}

function drawLabels() {
  noStroke();
  fill(168, 162, 155);
  textAlign(LEFT, CENTER);
  textSize(20);

  for (let i = 0; i < CHARGES.length; i++) {
    const c = CHARGES[i];
    const r = chargeRadius(c.q);
    text(formatQ(c.q), c.x + r + 14, c.y - r - 10);
  }
}

/* ===================== 指针交互 ===================== */
function pointerToWorld(ev) {
  const r = cnv.elt.getBoundingClientRect();
  if (!r.width || !r.height) return {x: 0, y: 0};
  // 屏幕坐标 → 画布 CSS 像素（兼容 CSS 缩放）→ 以中心为原点
  const px = ((ev.clientX - r.left) / r.width) * W;
  const py = ((ev.clientY - r.top) / r.height) * H;
  return {x: px - W / 2, y: py - H / 2};
}

function distToPlate(wx, wy, pl) {
  const hx = clamp(wx, pl.x - pl.len / 2, pl.x + pl.len / 2);
  return Math.hypot(wx - hx, wy - pl.y);
}

/* 世界坐标就是画布像素，抓取半径直接用像素，不需要再换算 */
function hitRadius() {
  return HIT_R;
}
function plateHit() {
  return PLATE_HIT;
}

/* 电荷优先（体积小、压在上层），再找平板 */
function pickAt(wx, wy) {
  const hr = hitRadius();
  let best = -1, bestD = hr;
  for (let i = 0; i < CHARGES.length; i++) {
    const d = Math.hypot(wx - CHARGES[i].x, wy - CHARGES[i].y);
    if (d < bestD) {
      bestD = d;
      best = i;
    }
  }
  if (best >= 0) return {kind: 'charge', idx: best, dx: 0, dy: 0};

  const ph = plateHit();
  for (let i = 0; i < PLATES.length; i++) {
    if (distToPlate(wx, wy, PLATES[i]) < ph) return {kind: 'plate', idx: i, dx: 0, dy: 0};
  }
  return NO_DRAG();
}

function attachPointer() {
  const e = cnv.elt;
  e.style.touchAction = 'none';

  e.addEventListener('pointerdown', ev => {
    const p = pointerToWorld(ev);
    pointer.x = p.x;
    pointer.y = p.y;
    drag = pickAt(p.x, p.y);
    if (drag.kind) {
      const item = drag.kind === 'charge' ? CHARGES[drag.idx] : PLATES[drag.idx];
      if (item) {
        // 记住抓取点相对中心的偏移，之后拖动保持这个偏移
        drag.dx = item.x - p.x;
        drag.dy = item.y - p.y;
      }
      try { e.setPointerCapture(ev.pointerId); } catch (_) {}
      ev.preventDefault();
    }
  });

  e.addEventListener('pointermove', ev => {
    const p = pointerToWorld(ev);
    pointer.x = p.x;
    pointer.y = p.y;

    if (drag.kind) {
      const item = drag.kind === 'charge' ? CHARGES[drag.idx] : PLATES[drag.idx];
      if (item) {
        // 平板要按自身半长限制，否则长板会被拖出画布
        const m = marginPx();
        const half = drag.kind === 'plate' ? item.len / 2 : 0;
        const limX = Math.max(0, W / 2 - m - half);
        const limY = Math.max(0, H / 2 - m);
        item.x = clamp(p.x + drag.dx, -limX, limX);
        item.y = clamp(p.y + drag.dy, -limY, limY);
        captureLayout();      // 记住相对位置，窗口变化时按比例还原
        ev.preventDefault();
      }
    }
  });

  const up = ev => {
    drag = NO_DRAG();
    try { e.releasePointerCapture(ev.pointerId); } catch (_) {}
  };
  e.addEventListener('pointerup', up);
  e.addEventListener('pointercancel', () => { drag = NO_DRAG(); });
}

function updateCursor() {
  hover = drag.kind ? drag : pickAt(pointer.x, pointer.y);
  cnv.elt.style.cursor = drag.kind ? 'grabbing' : hover.kind ? 'grab' : 'default';
}

/* ===================== 面板 ===================== */
const $ = id => document.getElementById(id);

/* 滑杆 + 数字框双向同步：拖也能量，直接键入也能量 */
function bindPair(rangeEl, numEl, apply) {
  const sync = src => {
    const v = parseFloat(src === 'range' ? rangeEl.value : numEl.value);
    if (!Number.isFinite(v)) return;              // 输入框里是 ""、"-" 这类中间态
    const cv = clamp(v, +rangeEl.min, +rangeEl.max);
    if (src === 'range') numEl.value = cv;
    else rangeEl.value = cv;
    apply(cv);
  };
  rangeEl.addEventListener('input', () => sync('range'));
  numEl.addEventListener('input', () => sync('number'));
  // 失焦时规整数字框（处理越界和中间态）
  numEl.addEventListener('change', () => { numEl.value = rangeEl.value; });
}

function setPair(rangeId, numId, v) {
  const r = $(rangeId), n = $(numId);
  if (r) r.value = v;
  if (n) n.value = v;
}

function buildPanel() {
  setPair('np', 'npn', N_PARTICLES);
  bindPair($('np'), $('npn'), v => setParticleCount(Math.round(v)));
  bindPair($('trl'), $('trln'), v => setTail(v));
  bindPair($('spd'), $('spdn'), v => { SPEED = v; });

  $('add').addEventListener('click', addCharge);
  $('addPlate').addEventListener('click', addPlate);
  $('reset').addEventListener('click', resetAll);

  // 电荷和平板共用一套委托处理器：靠 data-list 区分
  $('panel').addEventListener('input', ev => {
    const t = ev.target;
    if (!t.dataset || t.dataset.i === undefined || !t.dataset.list) return;

    const arr = t.dataset.list === 'plate' ? PLATES : CHARGES;
    const item = arr[+t.dataset.i];
    if (!item) return;

    const k = t.dataset.k;

    if (k === 'color') {
      item.color = t.value;
      const dot = t.parentElement.querySelector('.dot');
      if (dot) dot.style.background = t.value;
      rebuildSources();
      return;
    }

    if (k !== 'q' && k !== 'len' && k !== 'lambda') return;

    // 同一行里滑杆和数字框互为镜像
    const range = t.parentElement.querySelector('input[type=range]');
    const num = t.parentElement.querySelector('input[type=number]');
    if (!range || !num) return;

    const v = parseFloat(t.value);
    if (!Number.isFinite(v)) return;

    const cv = clamp(v, +range.min, +range.max);
    if (t.type === 'range') num.value = cv;
    else range.value = cv;

    if (k === 'q') item.q = cv;
    else if (k === 'len') item.len = cv;
    else item.lambda = cv;

    rebuildSources();
  });

  // 数字框失焦时规整
  $('panel').addEventListener('change', ev => {
    const t = ev.target;
    if (t.type !== 'number' || !t.dataset || t.dataset.i === undefined) return;
    const range = t.parentElement.querySelector('input[type=range]');
    if (range) t.value = range.value;
  });

  $('panel').addEventListener('click', ev => {
    const t = ev.target;
    if (!t.dataset || t.dataset.k !== 'del' || !t.dataset.list) return;

    const arr = t.dataset.list === 'plate' ? PLATES : CHARGES;
    arr.splice(+t.dataset.i, 1);
    drag = NO_DRAG();
    hover = NO_DRAG();
    rebuildSources();
    renderAll();
  });

  renderAll();
}

function chargeCard(c, i) {
  return `
  <div class="card">
    <div class="head">
      <span class="dot" style="background:${c.color}"></span>
      <span class="name">电荷 ${i + 1}</span>
      <input type="color" data-list="charge" data-k="color" data-i="${i}" value="${c.color}">
      <button class="del" data-list="charge" data-k="del" data-i="${i}" title="删除">×</button>
    </div>
    <label class="ctl">
      <span>q</span>
      <input type="range" data-list="charge" data-k="q" data-i="${i}"
             min="-3" max="3" step="0.05" value="${c.q}">
      <input type="number" data-list="charge" data-k="q" data-i="${i}"
             min="-3" max="3" step="0.05" value="${(+c.q).toFixed(2)}">
    </label>
  </div>`;
}

function plateCard(p, i) {
  return `
  <div class="card">
    <div class="head">
      <span class="dot bar" style="background:${p.color}"></span>
      <span class="name">平板 ${i + 1}</span>
      <input type="color" data-list="plate" data-k="color" data-i="${i}" value="${p.color}">
      <button class="del" data-list="plate" data-k="del" data-i="${i}" title="删除">×</button>
    </div>
    <label class="ctl">
      <span>长度</span>
      <input type="range" data-list="plate" data-k="len" data-i="${i}"
             min="160" max="1100" step="10" value="${p.len}">
      <input type="number" data-list="plate" data-k="len" data-i="${i}"
             min="160" max="1100" step="10" value="${Math.round(p.len)}">
    </label>
    <label class="ctl">
      <span>λ</span>
      <input type="range" data-list="plate" data-k="lambda" data-i="${i}"
             min="-1.4" max="1.4" step="0.05" value="${p.lambda}">
      <input type="number" data-list="plate" data-k="lambda" data-i="${i}"
             min="-1.4" max="1.4" step="0.05" value="${(+p.lambda).toFixed(2)}">
    </label>
  </div>`;
}

function renderAll() {
  $('chargeList').innerHTML = CHARGES.map(chargeCard).join('');
  $('plateList').innerHTML = PLATES.map(plateCard).join('');
  $('add').disabled = CHARGES.length >= MAX_CHARGES;
  $('addPlate').disabled = PLATES.length >= MAX_PLATES;
}

function addCharge() {
  if (CHARGES.length >= MAX_CHARGES) return;
  const mx = Math.max(40, W * 0.16);
  const my = Math.max(40, H * 0.16);
  CHARGES.push({
    x: random(-W / 2 + mx, W / 2 - mx),
    y: random(-H / 2 + my, H / 2 - my),
    q: random() < 0.5 ? 1 : -1,
    color: MORANDI[CHARGES.length % MORANDI.length],
  });
  captureLayout();
  rebuildSources();
  renderAll();
}

function addPlate() {
  if (PLATES.length >= MAX_PLATES) return;
  const len = Math.round(clamp(random(0.3, 0.55) * W, 160, 1100) / 10) * 10;
  const mx = Math.max(40, W * 0.12);
  const my = Math.max(40, H * 0.16);
  PLATES.push({
    x: random(-W / 2 + mx, W / 2 - mx),
    y: random(-H / 2 + my, H / 2 - my),
    len,
    lambda: Math.round(random(0.35, 0.8) * 20) / 20,
    color: MORANDI[(PLATES.length + 5) % MORANDI.length],
  });
  captureLayout();
  rebuildSources();
  renderAll();
}

function resetAll() {
  loadScene(MODE);
  SPEED = 3.4;
  drag = NO_DRAG();
  hover = NO_DRAG();

  const np0 = MODE === 'tall' ? 700 : 1400;
  setPair('np', 'npn', np0);
  setPair('spd', 'spdn', 3.4);
  setPair('trl', 'trln', 34);
  setTail(34);

  rebuildSources();
  setParticleCount(np0);
  renderAll();
}

function keyPressed() {
  if (key === 'r' || key === 'R') resetAll();
}
</script>

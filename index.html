<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>电磁场可视化</title>
<script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>
<script>
  /* 出错时把信息显示在页面上，否则画布黑掉会毫无线索 */
  window.addEventListener('error', function (e) {
    var d = document.getElementById('err');
    if (!d) {
      d = document.createElement('div');
      d.id = 'err';
      document.body.appendChild(d);
    }
    d.style.display = 'block';
    d.textContent += (d.textContent ? '\n' : '') + '脚本错误：' + e.message;
  });
</script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    background: #000;
    color: #b9b3ac;
    font: 13px/1.55 system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }

  #stage {
    flex: 1 1 auto;
    min-width: 0;
    display: grid;
    place-items: center;
    padding: 16px;
  }
  #stage canvas {
    display: block;
    width: auto !important;          /* p5 可能写死 inline 尺寸，这里强制按比例缩放 */
    height: auto !important;
    max-width: 100%;
    max-height: calc(100vh - 32px);
    border-radius: 10px;
    box-shadow: 0 24px 70px rgba(0, 0, 0, .85);
  }

  #panel {
    flex: 0 0 322px;
    width: 322px;
    height: 100%;
    overflow-y: auto;
    background: #0a0a0b;
    border-left: 1px solid #1c1c1f;
    padding: 18px 16px 48px;
  }
  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }

  #panel h1 { font-size: 14px; margin: 0 0 3px; color: #ded8d0; letter-spacing: .4px; font-weight: 600; }
  #panel .sub { margin: 0 0 4px; font-size: 11.5px; color: #6d6660; }
  #panel h2 {
    font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase;
    color: #6d6660; margin: 20px 0 10px; font-weight: 600;
  }
  #panel h2:first-of-type { margin-top: 14px; }

  .ctl {
    display: grid; grid-template-columns: 62px 1fr 46px;
    align-items: center; gap: 9px; margin: 0 0 9px;
  }
  .ctl > span { font-size: 11.5px; color: #8b837b; white-space: nowrap; }
  .ctl > output {
    font-size: 10.5px; color: #a9a29a; text-align: right;
    font-variant-numeric: tabular-nums;
  }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 3px; background: #26262a;
    border-radius: 2px; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px;
    border-radius: 50%; background: #b9b3ac; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 12px; height: 12px; border: none;
    border-radius: 50%; background: #b9b3ac; cursor: pointer;
  }
  input[type=color] {
    width: 34px; height: 22px; padding: 0; cursor: pointer;
    border: 1px solid #2a2a2e; border-radius: 4px;
    background: none; justify-self: start;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 2px; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 2px; }

  .card {
    border: 1px solid #1c1c1f; border-radius: 8px;
    padding: 9px 10px 4px; margin-bottom: 8px; background: #0d0d0f;
  }
  .card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
  .card .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .card .dot.bar { width: 16px; border-radius: 2px; }
  .card .name { flex: 1; font-size: 11.5px; color: #a9a29a; }
  .card .del {
    border: none; background: none; color: #5c5650;
    font-size: 16px; line-height: 1; padding: 0 3px; cursor: pointer;
  }
  .card .del:hover { color: #c98b7a; }
  .card .ctl { grid-template-columns: 30px 1fr 58px; margin-bottom: 6px; }

  .btn {
    width: 100%; padding: 8px; margin-top: 4px;
    border: 1px solid #2a2a2e; border-radius: 6px;
    background: #141416; color: #b9b3ac;
    font: inherit; font-size: 11.5px; cursor: pointer;
  }
  .btn:hover { border-color: #3a3a40; color: #ded8d0; }
  .btn.ghost { background: none; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .note { font-size: 10.5px; color: #5c5650; line-height: 1.6; margin: 10px 0 0; }

  #err {
    display: none; position: fixed; left: 12px; bottom: 12px; z-index: 99;
    max-width: 56vw; padding: 10px 14px; white-space: pre-wrap;
    background: #2a1616; color: #e8a6a6; border: 1px solid #532626;
    border-radius: 8px; font: 12px/1.6 ui-monospace, Consolas, monospace;
  }
</style>
</head>
<body>

<main id="stage"></main>

<aside id="panel">
  <h1>电磁场可视化</h1>
  <p class="sub">拖动电荷或平板 · 右侧实时调整</p>

  <h2>流场</h2>
  <label class="ctl"><span>粒子数</span>
    <input id="np" type="range" min="200" max="2600" step="100" value="1400">
    <output id="npv">1400</output>
  </label>
  <label class="ctl"><span>拖尾长度</span>
    <input id="trl" type="range" min="0" max="100" step="1" value="70">
    <output id="trlv">70</output>
  </label>
  <label class="ctl"><span>流速</span>
    <input id="spd" type="range" min="0.8" max="7" step="0.1" value="3.4">
    <output id="spdv">3.4</output>
  </label>

  <h2>电荷</h2>
  <div id="chargeList"></div>
  <button id="add" class="btn">+ 添加电荷</button>

  <h2>平板</h2>
  <div id="plateList"></div>
  <button id="addPlate" class="btn">+ 添加平板</button>

  <h2>全局</h2>
  <button id="reset" class="btn ghost">重置为默认</button>
  <p class="note">电荷量为正时向外发射场线，为负时吸收；为 0 不参与计算。<br>平板 λ 为 0 时不再发射场线，但仍然可以拖动。</p>
</aside>

<script>
/* =====================================================================
   电磁场可视化 —— 若干有限长带电平板 + 若干可拖动的点电荷
   粒子沿 E 运动，在独立拖尾层上留下场线；右侧面板实时改参数。

   点电荷:      E = k q (r−r0) / |r−r0|³
   有限长线电荷: Ex = kλ (1/ra − 1/rb)
                Ey = kλ (b/rb − a/ra) / y
   ===================================================================== */

const W = 1600, H = 900, R0 = 100;
const TAU = Math.PI * 2;
const BG = [6, 6, 8];            // 背景保持黑

/* ---------------- 莫兰迪色系 ---------------- */
/* 低饱和 + 灰度底子；亮度压到 60% 左右，在纯黑背景上才立得住 */
const MORANDI = [
  '#b48a84',   // 灰玫瑰
  '#8094a6',   // 灰蓝
  '#96a688',   // 灰绿
  '#9e8ca0',   // 灰紫
  '#baa07c',   // 灰驼
  '#8a8f96',   // 石墨
  '#a8928f',   // 灰褐
  '#8f9a8a',   // 灰橄榄
];

/* ---------------- 可编辑状态 ---------------- */
const DEFAULT_CHARGES = [
  {x: -470, y: -180, q:  1.00, color: '#b48a84'},
  {x:  170, y: -260, q: -1.30, color: '#8094a6'},
  {x:  600, y:  120, q:  0.70, color: '#96a688'},
];
const DEFAULT_PLATES = [
  {x: 0, y: 210, len: 620, lambda: 0.55, color: '#8a8f96'},
];

let CHARGES = DEFAULT_CHARGES.map(c => ({...c}));
let PLATES  = DEFAULT_PLATES.map(p => ({...p}));

let N_PARTICLES = 1400;
let SPEED = 3.4;
let TRAIL_ALPHA = 8.1;
const MAX_CHARGES = 8;
const MAX_PLATES  = 6;

/* 拖拽 / 悬停：{kind: 'charge'|'plate'|null, idx} */
let drag  = {kind: null, idx: -1};
let hover = {kind: null, idx: -1};

const HIT_R     = 38;    // 电荷抓取半径
const PLATE_HIT = 22;    // 平板抓取距离
const MARGIN    = 60;
const pointer   = {x: 0, y: 0};

let particles = [];
let sources   = [];
let trail;
let cnv;

/* ---------------- 小工具 ---------------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);

function hexToRgb(h) {
  let s = String(h).replace('#', '');
  if (s.length === 3) s = s.split('').map(c => c + c).join('');
  const n = parseInt(s, 16) || 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function formatQ(q) {
  if (Math.abs(q) < 0.005) return '0';
  return (q > 0 ? '+' : '−') + Math.abs(q).toFixed(2) + 'q';
}

function chargeRadius(q) {
  return 11 + Math.min(Math.abs(q), 2.6) * 6;
}

/* ---------------- 场 ---------------- */
function fieldAt(px, py) {
  const x = px / R0, y = py / R0;
  let ex = 0, ey = 0;

  for (let i = 0; i < CHARGES.length; i++) {
    const c = CHARGES[i];
    if (c.q === 0) continue;
    const dx = x - c.x / R0;
    const dy = y - c.y / R0;
    const r2 = dx * dx + dy * dy;
    if (r2 < 0.0016) continue;          // 避开奇点
    const inv = c.q / (r2 * Math.sqrt(r2));
    ex += inv * dx;
    ey += inv * dy;
  }

  for (let i = 0; i < PLATES.length; i++) {
    const pl = PLATES[i];
    if (pl.lambda === 0 || pl.len <= 0) continue;

    const L = pl.len / R0 / 2;
    const a = x - pl.x / R0 - L;
    const b = x - pl.x / R0 + L;
    const yy = y - pl.y / R0;
    const ra = Math.sqrt(a * a + yy * yy);
    const rb = Math.sqrt(b * b + yy * yy);
    const ys = Math.abs(yy) < 0.02 ? (yy >= 0 ? 0.02 : -0.02) : yy;

    ex += pl.lambda * (1 / ra - 1 / rb);
    ey += pl.lambda * (b / rb - a / ra) / ys;
  }

  return [ex, ey];
}

/* ---------------- 源头（谁在发射场线） ---------------- */
function rebuildSources() {
  sources = [];

  for (let i = 0; i < CHARGES.length; i++) {
    const c = CHARGES[i];
    if (c.q > 0) {
      sources.push({kind: 'charge', idx: i, w: Math.abs(c.q), rgb: hexToRgb(c.color)});
    }
  }

  for (let i = 0; i < PLATES.length; i++) {
    const pl = PLATES[i];
    if (pl.lambda > 0) {
      sources.push({kind: 'plate', idx: i, w: pl.lambda * 3.5, rgb: hexToRgb(pl.color)});
    }
  }

  for (let i = 0; i < sources.length; i++) sources[i].ch = i;
}

function pickSource() {
  if (!sources.length) return null;
  let total = 0;
  for (let i = 0; i < sources.length; i++) total += sources[i].w;
  if (total <= 0) return null;

  let r = random(total);
  for (let i = 0; i < sources.length; i++) {
    r -= sources[i].w;
    if (r <= 0) return sources[i];
  }
  return sources[sources.length - 1];
}

/* ---------------- 粒子 ---------------- */
function spawnParticle(p) {
  const src = pickSource();

  if (!src) {
    p.x = random(-W / 2, W / 2);
    p.y = random(-H / 2, H / 2);
    p.rgb = [150, 150, 150];
    p.ch = 0;
  } else if (src.kind === 'charge') {
    const c = CHARGES[src.idx];
    if (!c) { p.x = 0; p.y = 0; p.rgb = src.rgb; p.ch = src.ch; }
    else {
      const a = random(TAU);
      p.x = c.x + Math.cos(a) * 24;
      p.y = c.y + Math.sin(a) * 24;
      p.rgb = src.rgb;
      p.ch = src.ch;
    }
  } else {
    const pl = PLATES[src.idx];
    if (!pl) { p.x = 0; p.y = 0; p.rgb = src.rgb; p.ch = src.ch; }
    else {
      p.x = pl.x + random(-pl.len / 2, pl.len / 2);
      p.y = pl.y + (random() < 0.5 ? -1 : 1) * 14;
      p.rgb = src.rgb;
      p.ch = src.ch;
    }
  }

  p.mul     = random(0.85, 1.15);
  p.jit     = random(-0.03, 0.03);
  p.life    = 0;
  p.maxLife = random(160, 460);
  p.alpha   = random(80, 165);
  p.skip    = true;
}

function blankParticle() {
  return {x: 0, y: 0, rgb: [160, 160, 160], ch: 0, mul: 1, jit: 0,
          life: 0, maxLife: 300, alpha: 150, skip: true};
}

function setParticleCount(n) {
  N_PARTICLES = n;
  if (!particles) particles = [];
  while (particles.length < n) {
    const p = blankParticle();
    spawnParticle(p);
    particles.push(p);
  }
  if (particles.length > n) particles.length = n;
}

function initParticles() {
  particles = [];
  setParticleCount(N_PARTICLES);
}

/* 推进一步，返回这一小段（绘制与离线预览共用） */
function advect(p) {
  const f = fieldAt(p.x, p.y);

  const ca = Math.cos(p.jit), sa = Math.sin(p.jit);
  const rx = f[0] * ca - f[1] * sa;
  const ry = f[0] * sa + f[1] * ca;

  const m = Math.hypot(rx, ry);
  if (!(m > 1e-9)) {                    // 没有场：重新投放到有场的地方
    spawnParticle(p);
    return {skip: true};
  }

  const step = SPEED * p.mul;
  const nx = p.x + (rx / m) * step;
  const ny = p.y + (ry / m) * step;

  const seg = {x0: p.x, y0: p.y, x1: nx, y1: ny, rgb: p.rgb, a: p.alpha, ch: p.ch, skip: p.skip};

  p.skip = false;
  p.x = nx;
  p.y = ny;
  p.life++;

  let dead = p.life > p.maxLife;
  if (Math.abs(p.x) > W / 2 + 40 || Math.abs(p.y) > H / 2 + 40) dead = true;
  for (let k = 0; k < CHARGES.length; k++) {
    const c = CHARGES[k];
    if (c.q !== 0 && Math.hypot(p.x - c.x, p.y - c.y) < 24) dead = true;
  }
  if (dead) spawnParticle(p);

  return seg;
}

rebuildSources();   // 纯 JS，不碰 p5，可以在顶层跑

/* ===================== p5 ===================== */
function setup() {
  cnv = createCanvas(W, H);
  cnv.parent('stage');
  pixelDensity(1);
  randomSeed(7);

  // 必须等 p5 就绪后再初始化粒子：spawnParticle 用到 p5 的 random()
  initParticles();

  trail = createGraphics(W, H);
  trail.pixelDensity(1);
  trail.background(BG[0], BG[1], BG[2]);

  buildPanel();
  attachPointer();
}

function draw() {
  // ① 拖尾层：不清空，只按 alpha 衰减
  trail.background(BG[0], BG[1], BG[2], TRAIL_ALPHA);

  // 粒子坐标以画布中心为原点，trail 原点在左上角，必须做同样的平移
  trail.push();
  trail.translate(W / 2, H / 2);
  trail.strokeCap(ROUND);
  trail.strokeWeight(1.25);

  for (let i = 0; i < particles.length; i++) {
    const s = advect(particles[i]);
    if (s.skip) continue;
    trail.stroke(s.rgb[0], s.rgb[1], s.rgb[2], s.a);
    trail.line(s.x0, s.y0, s.x1, s.y1);
  }
  trail.pop();

  // ② 主画布：每帧重画，静态元素不会累积
  background(BG[0], BG[1], BG[2]);
  image(trail, 0, 0);

  if (drag.kind === 'charge' && drag.idx >= CHARGES.length) drag = {kind: null, idx: -1};
  if (drag.kind === 'plate' && drag.idx >= PLATES.length) drag = {kind: null, idx: -1};

  push();
  translate(W / 2, H / 2);
  drawPlates();
  drawCharges();
  drawLabels();
  pop();

  drawCaption();
  updateCursor();
}

function drawPlates() {
  for (let i = 0; i < PLATES.length; i++) {
    const pl = PLATES[i];
    const rgb = hexToRgb(pl.color);
    const active = (hover.kind === 'plate' && hover.idx === i) ||
                   (drag.kind === 'plate' && drag.idx === i);
    const x0 = pl.x - pl.len / 2, x1 = pl.x + pl.len / 2;

    noStroke();
    for (let k = 6; k > 0; k--) {
      fill(rgb[0], rgb[1], rgb[2], active ? 14 : 9);
      rect(x0 - k * 3, pl.y - 9 - k * 2, pl.len + k * 6, 18 + k * 4, 8);
    }

    fill(12, 12, 14);
    stroke(rgb[0], rgb[1], rgb[2], active ? 255 : 185);
    strokeWeight(active ? 3 : 2);
    rect(x0, pl.y - 9, pl.len, 18, 7);

    noStroke();
    fill(rgb[0], rgb[1], rgb[2], 210);
    textAlign(CENTER, CENTER);
    textSize(13);
    const sign = pl.lambda < 0 ? '−' : '+';
    const n = Math.max(3, Math.round(pl.len / 70));
    for (let k = 0; k < n; k++) {
      text(sign, x0 + (k + 0.5) * (pl.len / n), pl.y);
    }

    if (active) {
      noFill();
      stroke(rgb[0], rgb[1], rgb[2], 90);
      strokeWeight(1);
      rect(x0 - 6, pl.y - 14, pl.len + 12, 28, 10);
      noStroke();
    }

    // 标签
    fill(130, 124, 118);
    textAlign(LEFT, CENTER);
    textSize(16);
    text('平板 λ=' + pl.lambda.toFixed(2), x1 + 20, pl.y);
  }
}

function drawCharges() {
  for (let i = 0; i < CHARGES.length; i++) {
    const c = CHARGES[i];
    const rgb = hexToRgb(c.color);
    const r = chargeRadius(c.q);

    noStroke();
    for (let k = 7; k > 0; k--) {
      fill(rgb[0], rgb[1], rgb[2], 11);
      circle(c.x, c.y, r * 2 + k * 13);
    }

    fill(rgb[0], rgb[1], rgb[2]);
    circle(c.x, c.y, r * 2);

    if (hover.kind === 'charge' && hover.idx === i) {
      noFill();
      stroke(rgb[0], rgb[1], rgb[2], drag.kind === 'charge' ? 235 : 120);
      strokeWeight(drag.kind === 'charge' ? 2.5 : 1.5);
      circle(c.x, c.y, r * 2 + 14 + (drag.kind === 'charge' ? 6 : 0));
      noStroke();
    }

    fill(10, 10, 12);
    textAlign(CENTER, CENTER);
    textSize(r * 1.1);
    textStyle(BOLD);
    text(c.q > 0 ? '+' : c.q < 0 ? '−' : '·', c.x, c.y + 1);
    textStyle(NORMAL);
  }
}

function drawLabels() {
  noStroke();
  fill(168, 162, 155);
  textAlign(LEFT, CENTER);
  textSize(20);

  for (let i = 0; i < CHARGES.length; i++) {
    const c = CHARGES[i];
    const r = chargeRadius(c.q);
    text(formatQ(c.q), c.x + r + 14, c.y - r - 10);
  }
}

function drawCaption() {
  noStroke();

  const a = '电场线从正电荷与平板表面流出，终止于负电荷或延伸至无穷远';
  textSize(17);
  textAlign(LEFT, TOP);
  const wa = textWidth(a);
  fill(0, 0, 0, 190);
  rect(24, 20, wa + 28, 36, 9);
  fill(110, 104, 98);
  text(a, 38, 30);

  const b = '线的疏密对应场强 · 颜色对应源头';
  textSize(15);
  textAlign(RIGHT, BOTTOM);
  const wb = textWidth(b);
  fill(0, 0, 0, 190);
  rect(W - 37 - wb - 26, H - 56, wb + 26, 32, 9);
  fill(110, 104, 98);
  text(b, W - 37, H - 32);
}

/* ===================== 指针交互 ===================== */
function pointerToWorld(ev) {
  const r = cnv.elt.getBoundingClientRect();
  if (!r.width || !r.height) return {x: 0, y: 0};
  return {
    x: ((ev.clientX - r.left) / r.width) * W - W / 2,
    y: ((ev.clientY - r.top) / r.height) * H - H / 2,
  };
}

function distToPlate(wx, wy, pl) {
  const hx = clamp(wx, pl.x - pl.len / 2, pl.x + pl.len / 2);
  return Math.hypot(wx - hx, wy - pl.y);
}

/* 电荷优先（体积小、压在上层），再找平板 */
function pickAt(wx, wy) {
  let best = -1, bestD = HIT_R;
  for (let i = 0; i < CHARGES.length; i++) {
    const d = Math.hypot(wx - CHARGES[i].x, wy - CHARGES[i].y);
    if (d < bestD) {
      bestD = d;
      best = i;
    }
  }
  if (best >= 0) return {kind: 'charge', idx: best};

  for (let i = 0; i < PLATES.length; i++) {
    if (distToPlate(wx, wy, PLATES[i]) < PLATE_HIT) return {kind: 'plate', idx: i};
  }
  return {kind: null, idx: -1};
}

function attachPointer() {
  const e = cnv.elt;
  e.style.touchAction = 'none';

  e.addEventListener('pointerdown', ev => {
    const p = pointerToWorld(ev);
    pointer.x = p.x;
    pointer.y = p.y;
    drag = pickAt(p.x, p.y);
    if (drag.kind) {
      try { e.setPointerCapture(ev.pointerId); } catch (_) {}
      ev.preventDefault();
    }
  });

  e.addEventListener('pointermove', ev => {
    const p = pointerToWorld(ev);
    pointer.x = p.x;
    pointer.y = p.y;

    if (drag.kind) {
      const item = drag.kind === 'charge' ? CHARGES[drag.idx] : PLATES[drag.idx];
      if (item) {
        item.x = clamp(p.x, -W / 2 + MARGIN, W / 2 - MARGIN);
        item.y = clamp(p.y, -H / 2 + MARGIN, H / 2 - MARGIN);
        ev.preventDefault();
      }
    }
  });

  const up = ev => {
    drag = {kind: null, idx: -1};
    try { e.releasePointerCapture(ev.pointerId); } catch (_) {}
  };
  e.addEventListener('pointerup', up);
  e.addEventListener('pointercancel', () => { drag = {kind: null, idx: -1}; });
}

function updateCursor() {
  hover = drag.kind ? drag : pickAt(pointer.x, pointer.y);
  cnv.elt.style.cursor = drag.kind ? 'grabbing' : hover.kind ? 'grab' : 'default';
}

/* ===================== 面板 ===================== */
const $ = id => document.getElementById(id);

function buildPanel() {
  const np = $('np'), npv = $('npv');
  np.value = N_PARTICLES;
  npv.textContent = N_PARTICLES;
  np.addEventListener('input', () => {
    setParticleCount(+np.value);
    npv.textContent = np.value;
  });

  const tr = $('trl'), trv = $('trlv');
  tr.value = 70;
  trv.textContent = 70;
  TRAIL_ALPHA = 20 - 70 * 0.17;
  tr.addEventListener('input', () => {
    TRAIL_ALPHA = 20 - (+tr.value) * 0.17;
    trv.textContent = tr.value;
  });

  const sp = $('spd'), spv = $('spdv');
  sp.value = SPEED;
  spv.textContent = SPEED.toFixed(1);
  sp.addEventListener('input', () => {
    SPEED = +sp.value;
    spv.textContent = SPEED.toFixed(1);
  });

  $('add').addEventListener('click', addCharge);
  $('addPlate').addEventListener('click', addPlate);
  $('reset').addEventListener('click', resetAll);

  // 电荷和平板共用一个委托处理器：靠 data-list 区分
  $('panel').addEventListener('input', ev => {
    const t = ev.target;
    if (!t.dataset || t.dataset.i === undefined || !t.dataset.list) return;

    const arr = t.dataset.list === 'plate' ? PLATES : CHARGES;
    const item = arr[+t.dataset.i];
    if (!item) return;

    const k = t.dataset.k;
    if (k === 'q') item.q = +t.value;
    else if (k === 'len') item.len = +t.value;
    else if (k === 'lambda') item.lambda = +t.value;
    else if (k === 'color') {
      item.color = t.value;
      const dot = t.parentElement.querySelector('.dot');
      if (dot) dot.style.background = t.value;
    } else return;

    const out = t.parentElement.querySelector('output');
    if (out) {
      out.textContent = k === 'q' ? formatQ(item.q)
        : k === 'lambda' ? item.lambda.toFixed(2)
        : item.len;
    }

    rebuildSources();
  });

  $('panel').addEventListener('click', ev => {
    const t = ev.target;
    if (!t.dataset || t.dataset.k !== 'del' || !t.dataset.list) return;

    const arr = t.dataset.list === 'plate' ? PLATES : CHARGES;
    arr.splice(+t.dataset.i, 1);
    drag = {kind: null, idx: -1};
    hover = {kind: null, idx: -1};
    rebuildSources();
    renderAll();
  });

  renderAll();
}

function chargeCard(c, i) {
  return `
  <div class="card">
    <div class="head">
      <span class="dot" style="background:${c.color}"></span>
      <span class="name">电荷 ${i + 1}</span>
      <input type="color" data-list="charge" data-k="color" data-i="${i}" value="${c.color}">
      <button class="del" data-list="charge" data-k="del" data-i="${i}" title="删除">×</button>
    </div>
    <label class="ctl">
      <span>q</span>
      <input type="range" data-list="charge" data-k="q" data-i="${i}"
             min="-3" max="3" step="0.05" value="${c.q}">
      <output>${formatQ(c.q)}</output>
    </label>
  </div>`;
}

function plateCard(p, i) {
  return `
  <div class="card">
    <div class="head">
      <span class="dot bar" style="background:${p.color}"></span>
      <span class="name">平板 ${i + 1}</span>
      <input type="color" data-list="plate" data-k="color" data-i="${i}" value="${p.color}">
      <button class="del" data-list="plate" data-k="del" data-i="${i}" title="删除">×</button>
    </div>
    <label class="ctl">
      <span>长度</span>
      <input type="range" data-list="plate" data-k="len" data-i="${i}"
             min="160" max="1100" step="10" value="${p.len}">
      <output>${p.len}</output>
    </label>
    <label class="ctl">
      <span>λ</span>
      <input type="range" data-list="plate" data-k="lambda" data-i="${i}"
             min="-1.4" max="1.4" step="0.05" value="${p.lambda}">
      <output>${p.lambda.toFixed(2)}</output>
    </label>
  </div>`;
}

function renderAll() {
  $('chargeList').innerHTML = CHARGES.map(chargeCard).join('');
  $('plateList').innerHTML = PLATES.map(plateCard).join('');
  $('add').disabled = CHARGES.length >= MAX_CHARGES;
  $('addPlate').disabled = PLATES.length >= MAX_PLATES;
}

function addCharge() {
  if (CHARGES.length >= MAX_CHARGES) return;
  CHARGES.push({
    x: random(-W / 2 + 240, W / 2 - 240),
    y: random(-H / 2 + 210, H / 2 - 210),
    q: random() < 0.5 ? 1 : -1,
    color: MORANDI[CHARGES.length % MORANDI.length],
  });
  rebuildSources();
  renderAll();
}

function addPlate() {
  if (PLATES.length >= MAX_PLATES) return;
  const len = Math.round(random(280, 560) / 10) * 10;
  PLATES.push({
    x: random(-W / 2 + 320, W / 2 - 320),
    y: random(-H / 2 + 200, H / 2 - 200),
    len,
    lambda: Math.round(random(0.35, 0.8) * 20) / 20,
    color: MORANDI[(PLATES.length + 5) % MORANDI.length],
  });
  rebuildSources();
  renderAll();
}

function resetAll() {
  CHARGES = DEFAULT_CHARGES.map(c => ({...c}));
  PLATES  = DEFAULT_PLATES.map(p => ({...p}));
  SPEED = 3.4;
  drag = {kind: null, idx: -1};
  hover = {kind: null, idx: -1};

  $('np').value = 1400;
  $('npv').textContent = 1400;
  $('spd').value = 3.4;
  $('spdv').textContent = '3.4';
  $('trl').value = 70;
  $('trlv').textContent = '70';
  TRAIL_ALPHA = 20 - 70 * 0.17;

  rebuildSources();
  setParticleCount(1400);
  trail.background(BG[0], BG[1], BG[2]);
  renderAll();
}

function keyPressed() {
  if (key === 'r' || key === 'R') resetAll();
}
</script>
